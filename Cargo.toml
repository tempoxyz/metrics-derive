[package]
name = "metrics-derive"
description = "Proc macro for automatically describing and initializing metrics"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rkrasiuk/metrics-derive"
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

[dev-dependencies]
metrics = "0.24.0"
serial_test = "3"
trybuild = "1.0"
